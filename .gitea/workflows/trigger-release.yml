name: Trigger Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'The version with which the code should be released'
        type: string
        required: true
      post-release-version:
        description: 'The next snapshot version'
        type: string
        required: true

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, which also pins the Gradle that the steps use (gradle, not ./gradlew:
      # no wrapper download per job). Update the digest when the image is rebuilt
      image: registry.nvaria.cloud/ubuntu-act-jdk25:latest@sha256:af64c5d732fc196c89b2f2f3c599b85eccd2d636a1a00d12ef997a661bccd82b
      credentials:
        username: ${{ secrets.DOCKERUSER }}
        password: ${{ secrets.DOCKERPW }}
    env:
      RUNNER_TOOL_CACHE: /toolcache
      NEXUS_MVN_RELEASE: ${{ vars.NEXUS_MVN_RELEASE  }}
      NEXUS_MVN_SNAPSHOTS: ${{ vars.NEXUS_MVN_SNAPSHOTS }}
      NEXUS_USER: ${{ secrets.DOCKERUSER }}
      NEXUS_PW: ${{ secrets.DOCKERPW }}
      # Inputs reach the shell only as environment variables, never pasted into a script,
      # so a crafted version string can't run commands
      RELEASE_VERSION: ${{ inputs.release-version }}
      POST_RELEASE_VERSION: ${{ inputs.post-release-version }}
    name: Trigger the release
    steps:
      - name: Validate versions
        shell: bash
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$RELEASE_VERSION" =~ $semver ]] || { echo "Invalid release-version: must look like 1.2.3"; exit 1; }
          [[ "$POST_RELEASE_VERSION" =~ $semver ]] || { echo "Invalid post-release-version: must look like 1.2.4-SNAPSHOT"; exit 1; }
      # Pinned to the commit of actions/checkout v7.0.1. The release task pushes
      # the release commit and tag, so the token stays configured for git.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.PAT }}
      - name: Set Git User and Email
        run: |
          git config --global user.email "gitea@nvaria.cloud"
          git config --global user.name "Gitea Action"
      - name: Run gradle release task
        run: gradle release -PreleaseVersion="$RELEASE_VERSION" -PpostReleaseVersion="$POST_RELEASE_VERSION"
